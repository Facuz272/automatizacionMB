[project]
name = "mb-lead-engine"
version = "2.0.0"
description = "Lead Engine v2: condos/HOAs/property managers enriched and precalified for the MB CRM"
requires-python = ">=3.11"
dependencies = [
  "anthropic>=2.6",
  "beautifulsoup4>=4.12",
  "loguru>=0.7",
  "pydantic>=2.7",
  "python-dotenv>=1.0",
  "requests>=2.31",
  "dnspython>=2.6",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
browser = ["playwright>=1.45"]

[project.scripts]
lead-engine = "lead_engine.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["lead_engine*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
